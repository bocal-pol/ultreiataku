<title>Ultreïataku — Compagnon du Chemin</title>

<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{--be:#c8792a;--fr:#2f5d3a;--es:#a83232;--bg:#f5ead8;--panel:#fffdf8;--ink:#1a1208;--muted:#9a8060;--want:#b8352f;--line:#ddd0b8;--go:#2f7d4f;--skip:#a99a80;--gold:#c8963c;--ocre:#8a6020;--nuit:#1a1208;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
  #map{position:fixed;inset:0;background:#dfe6df;z-index:1}
  .ic{vertical-align:middle;flex:0 0 auto}
  #top b,.ovhead b,.daytitle h2,.md h1,.md h2{font-family:Georgia,'Times New Roman',serif;letter-spacing:.4px}
  #top b{color:#f5ead8}
  #top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:9px 13px;background:linear-gradient(#2a1d0e,#1a1208);color:#fff;z-index:1200;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  #top b{font-size:15px;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
  #top .pos{font-size:11.5px;opacity:.92;margin-left:auto;text-align:right;line-height:1.3;max-width:55%}
  .mapbtn{position:fixed;right:12px;z-index:1200;width:46px;height:46px;border:none;border-radius:12px;background:#fff;color:#8a6020;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
  #zin{bottom:288px}#zout{bottom:236px}#loc{bottom:184px}#lyr{bottom:132px}
  .mapbtn.on{background:#8a6020;color:#fff}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:1300;background:var(--panel);border-radius:18px 18px 0 0;box-shadow:0 -4px 22px rgba(0,0,0,.28);max-height:74%;display:flex;flex-direction:column;transition:transform .25s ease}
  #sheet.collapsed #body{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;opacity:0}
  #grip{padding:9px 0 5px;text-align:center;cursor:pointer;flex:0 0 auto}
  #grip .bar{display:inline-block;width:42px;height:5px;border-radius:3px;background:#cfcabd}
  #head{padding:0 16px 10px;flex:0 0 auto}
  #selrow{display:flex;gap:8px}
  select{flex:1 1 0;min-width:0;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fbfaf6;font-size:14px;color:var(--ink);text-overflow:ellipsis}
  #gpsbtn{padding:0 13px;border:none;border-radius:10px;background:#f3ead9;color:#8a6020;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
  #body{padding:0 16px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:64vh;transition:max-height .26s ease,padding .26s ease,opacity .2s ease}
  .daytitle{display:flex;align-items:center;gap:9px;margin:4px 0 2px;flex-wrap:wrap}
  .flag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;letter-spacing:.3px}
  .flag.BE{background:var(--be)}.flag.FR{background:var(--fr)}.flag.ES{background:var(--es)}
  .flag.BX{background:#0e8a8a}.flag.PC{background:#6a4a9c}
  .daytitle h2{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
  .banner{display:flex;gap:9px;border-radius:12px;padding:11px 13px;margin:10px 0;font-size:13.5px;line-height:1.45;align-items:flex-start}
  .rest{background:#eaf3ff;border:1px solid #cfe0f5;color:#1c3f66}
  .rest.demi{background:#fff6e6;border:1px solid #f0dcae;color:#7a5410}
  .note{background:#f6f4ee;border:1px solid var(--line);color:#4a4f45}
  .faune{background:#fbf1e4;border:1px solid #ecd8b8;color:#7a5410}
  .busb{background:#e9eef5;border:1px solid #cbd9ec;color:#2d4d70}
  .join{background:#e2f2f2;border:1px solid #b6dede;color:#0e6a6a}
  .join .ic{color:#0e8a8a}
  .infos{display:flex;flex-direction:column;gap:9px;margin:12px 0}
  .inforow{display:flex;gap:10px;font-size:13.5px;line-height:1.4}
  .inforow .ic{color:#8a6020;margin-top:1px}
  .inforow .lbl{font-weight:600;display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 0 4px;display:flex;align-items:center;gap:7px}
  .alt{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:9px 0}
  .alt.want{border-color:#e6c3bf;background:#fdf5f4}
  .alt .n{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:14px}
  .alt .n .ic{margin-top:1px;color:#5a6b52}
  .alt.want .n .ic{color:var(--want)}
  .badge{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:#f0eee6;border-radius:20px;padding:2px 9px;margin:7px 0 0}
  .alt .m{font-size:12.5px;color:var(--muted);margin:6px 0 0;line-height:1.4}
  .choice{display:flex;gap:8px;margin-top:10px}
  .choice button{flex:1;border:1px solid var(--line);background:#fbfaf6;border-radius:9px;padding:9px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .choice button.go.sel{background:var(--go);color:#fff;border-color:var(--go)}
  .choice button.skip.sel{background:var(--skip);color:#fff;border-color:var(--skip)}
  .onpath{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
  .empty{color:var(--muted);font-size:14px;padding:12px 0;display:flex;gap:8px;align-items:center}
  .daynav{display:flex;justify-content:space-between;gap:8px;margin:8px 0 12px}
  .daynav button{flex:1;border:1px solid var(--line);background:#f6f4ee;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .daynav button.next{background:#f3ead9;color:#8a6020}
  .flip{transform:scaleX(-1)}
  .hidden{display:none!important}
  .overlay{position:fixed;inset:0;z-index:1500;background:var(--bg);display:flex;flex-direction:column}
  .ovhead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(#2a1d0e,#1a1208);color:#fff}
  .ovhead b{font-size:16px}
  .ovhead button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #menuclose{margin-left:auto}
  #menubtn{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  #menulist{padding:12px 14px;overflow-y:auto}
  .menuintro{color:var(--muted);font-size:13px;margin:2px 2px 14px;line-height:1.5}
  .menuitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
  .menuitem .ic{color:#8a6020}
  #guidebody{padding:16px 18px 44px;overflow-y:auto;-webkit-overflow-scrolling:touch;line-height:1.55}
  .md h1{font-size:20px;margin:14px 0 8px}
  .md h2{font-size:17px;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .md h3{font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}.md li{margin:3px 0}
  .md blockquote{border-left:3px solid #cbd9ec;background:#f3ead9;margin:10px 0;padding:8px 12px;border-radius:0 8px 8px 0}
  .md code{background:#f0eee6;border-radius:5px;padding:1px 5px;font-size:12.5px}
  .md pre{background:#f0eee6;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}
  .md hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .md table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto}
  .md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .md th{background:#f3ead9}
  .gpxline{font-size:12px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
  .gpxline code{background:#f0eee6;border-radius:5px;padding:1px 5px;font-size:11px}
  .leaflet-control-attribution{font-size:10px}
  @media(min-width:780px){#sheet{left:auto;right:16px;bottom:16px;top:62px;width:410px;border-radius:16px;max-height:none}#sheet.collapsed{transform:none}.mapbtn{right:442px}}
  /* ===== Habillage Ultreïataku ===== */
  #top{border-bottom:1px solid rgba(200,150,60,.35)}
  #top .pos{color:#e9d9bd;opacity:.9}
  .mapbtn{border-radius:50%;background:#fffdf8;color:#8a6020;border:1px solid #e4d5b6;box-shadow:0 2px 10px rgba(26,18,8,.22)}
  .mapbtn.on{background:#c8963c;color:#1a1208;border-color:#c8963c}
  #sheet{border-top:2px solid #c8963c;box-shadow:0 -6px 26px rgba(26,18,8,.30)}
  #grip .bar{background:#d8c6a0}
  select{border-color:#e0d2b4;background:#fbf4e6}
  #gpsbtn{background:#f3ead9;color:#8a6020}
  .flag{font-family:Georgia,serif;letter-spacing:.5px}
  .sub b{color:#8a6020}
  h3.sec{color:#8a6020}
  .alt{border-color:#e4d5b6;background:#fffdf8}
  .alt.want{border-color:#d8b26a;background:#fbf1dd}
  .alt .n .ic{color:#8a6020}.alt.want .n .ic{color:#b8352f}
  .badge{background:#f0e6d0;color:#8a6020}
  .choice button{background:#fbf4e6;border-color:#e0d2b4;color:#4a3010}
  .choice button.go.sel{background:#8a6020;color:#f5ead8;border-color:#8a6020}
  .choice button.skip.sel{background:#a99a80;color:#fff;border-color:#a99a80}
  .rest{background:#f6ecd6;border-color:#e6cf9f;color:#6b4e1e}
  .rest.demi{background:#fbf1dd;border-color:#e6cf9f;color:#7a5410}
  .note{background:#f4ece0;border-color:#e0d2b4;color:#4a3010}
  .busb{background:#ece3d2;border-color:#d8c6a0;color:#4a3010}
  .gpxline{border-top-color:#e4d5b6}.gpxline code,.md code{background:#f0e6d0}
  .inforow .lbl{color:#9a8060}
  .menuitem{background:#fffdf8;border-color:#e4d5b6;border-left:3px solid #c8963c;font-family:Georgia,serif}
  .menuitem .ic{color:#8a6020}
  .md h2{border-bottom-color:#e4d5b6;color:#4a3010}.md h3{color:#8a6020}
  .md blockquote{border-left-color:#c8963c;background:#faf3e4;color:#4a3010}
  .md table th{background:#f3ead9}
  /* ===== Écran d'accueil ===== */
  #splash{position:fixed;inset:0;z-index:3000;background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .55s ease}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .eyebrow{color:#c8963c;font-size:12px;letter-spacing:5px;font-family:Inter,system-ui,sans-serif;text-transform:uppercase;margin-bottom:6px}
  #splash .name{font-family:Georgia,serif;font-size:46px;letter-spacing:3px;color:#f5ead8;margin:16px 0 6px}
  #splash .name span{color:#c8963c}
  #splash .cri{font-family:Georgia,serif;font-style:italic;color:rgba(245,234,216,.55);font-size:18px;margin-bottom:4px}
  #splash .devise{font-family:Georgia,serif;font-style:italic;color:#c8963c;font-size:15px;margin-bottom:30px}
  #splash button{background:#c8963c;color:#1a1208;border:none;border-radius:30px;padding:14px 26px;font-size:15px;font-weight:600;font-family:Georgia,serif;letter-spacing:.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  #splash .foot{position:absolute;bottom:26px;left:0;right:0;color:#9a8060;font-size:11px;letter-spacing:2px;font-family:Inter,system-ui,sans-serif}
  /* ===== Menu en cartes groupées ===== */
  .mgroup{font-size:11px;letter-spacing:1.5px;color:#9a8060;text-transform:uppercase;margin:16px 4px 8px;font-family:system-ui,sans-serif}
  .menuitem{align-items:center;padding:15px 14px;margin-bottom:9px}
  .menuitem .mtxt{flex:1;display:flex;flex-direction:column;min-width:0}
  .menuitem .mt{font-family:Georgia,serif;font-size:15.5px;color:#1a1208}
  .menuitem .md2{font-size:12px;color:#9a8060;margin-top:1px;font-family:system-ui,sans-serif}
  .menuitem .chev{color:#c8b58a;flex:0 0 auto}
  /* ===== Fiches en pages éditoriales ===== */
  #guidebody{font-size:15px;line-height:1.5;padding:16px 18px 48px}
  .md h1{font-size:22px;line-height:1.25;margin:2px 0 14px}
  .md h2{border-bottom:none;font-size:17px;color:#4a3010;padding:0;margin:24px 0 9px}
  .md h2::after{content:"";display:block;width:44px;height:3px;background:#c8963c;border-radius:2px;margin-top:7px}
  .md h3{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#8a6020;margin:16px 0 4px}
  .md p{margin:0 0 9px}
  .md ul,.md ol{margin:4px 0 12px;padding-left:22px}
  .md li{margin:3px 0;line-height:1.45}
  .md ul li::marker{color:#c8963c}
  .md blockquote{font-size:14.5px;line-height:1.5;border-left:3px solid #c8963c;background:#f7efe0;color:#5a4520;border-radius:0 10px 10px 0;padding:11px 14px;margin:12px 0}
  .md hr{border:none;border-top:1px solid #e4d5b6;margin:16px 0}
  .md table{border:none;border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border-radius:12px;box-shadow:0 0 0 1px #e4d5b6}
  .md th{border:none;border-bottom:1px solid #e4d5b6;background:#f3ead9;color:#8a6020;font-weight:600;padding:9px 11px;white-space:nowrap}
  .md td{border:none;border-bottom:1px solid #ede0c8;padding:9px 11px;white-space:nowrap}
  .md tbody tr:nth-child(even){background:#fdf8ee}
  .md th:first-child,.md td:first-child{white-space:normal;min-width:104px}
  /* ===== Cases à cocher (checklists + colonnes solo/duo) ===== */
  .cbx{display:inline-block;width:17px;height:17px;border:2px solid #c8963c;border-radius:5px;vertical-align:-3px;margin-right:8px;position:relative;box-sizing:border-box}
  .cbx.on{background:#8a6020;border-color:#8a6020}
  .cbx.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
  .md li.chk{list-style:none;margin-left:-18px}
  .md li.chk::marker{content:""}
  .md td .cbx{margin-right:0}
  .md td.ck{text-align:center}
  /* ===== Ergonomie smartphone (marche, une main, plein soleil) ===== */
  .mapbtn{width:50px;height:50px}
  #zin{bottom:302px}#zout{bottom:246px}#loc{bottom:190px}#lyr{bottom:134px}
  #body{font-size:14.5px}
  .alt .n{font-size:15px}.alt .m{font-size:13px}
  .inforow{font-size:14.5px}
  .banner{font-size:14px}
  .choice button{padding:13px 10px;font-size:14px}
  .daynav button{padding:12px 8px;font-size:13px}
  #gpsbtn{padding:0 15px;font-size:14px}
  select{padding:13px;font-size:15px}
  .ovhead button,#menubtn{width:42px;height:42px}
  @media(min-width:780px){.mapbtn{right:442px}#sheet.collapsed #body{max-height:none;padding:0 16px 26px;opacity:1}}
  /* ===== Mode nuit (lecture au gîte, sans éblouir) ===== */
  #nightbtn{background:rgba(255,255,255,.16);border:none;color:#f5ead8;border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;margin-left:8px}
  html.night{--bg:#120d07;--panel:#211812;--ink:#efe3ce;--muted:#b39c74;--line:#3a2c1c}
  html.night #map{filter:brightness(.68) contrast(1.04) saturate(.85)}
  html.night .mapbtn{background:#211812;color:#e0b866;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  html.night .mapbtn.on{background:#c8963c;color:#1a1208}
  html.night select{background:#1a130c;color:var(--ink);border-color:var(--line)}
  html.night #gpsbtn{background:#2c2114;color:#e0b866}
  html.night .menuitem .mt{color:var(--ink)}
  html.night .rest{background:#16233a;border-color:#2a3f5f;color:#bcd3f0}
  html.night .rest.demi{background:#2e2410;border-color:#4a3a18;color:#e3c98a}
  html.night .note{background:#1c1810;border-color:var(--line);color:#cfc4ab}
  html.night .faune{background:#2a1e10;border-color:#4a3418;color:#e3c98a}
  html.night .busb{background:#182230;border-color:#2c4058;color:#a9c2df}
  html.night .join{background:#0e2626;border-color:#1e4a4a;color:#8fd6d6}
  html.night .alt{border-color:var(--line)}
  html.night .alt.want{background:#2a1614;border-color:#6e2e2a}
  html.night .badge{background:#2c2418;color:var(--muted)}
  html.night .choice button{background:#1a130c;color:var(--ink);border-color:var(--line)}
  html.night .daynav button{background:#1a130c;color:var(--ink);border-color:var(--line)}
  html.night .daynav button.next{background:#2c2114;color:#e0b866}
  html.night .md blockquote{background:#241a0d;color:#e3d3b0;border-left-color:#c8963c}
  html.night .md th{background:#2a2013;color:#e0b866;border-bottom-color:var(--line)}
  html.night .md td{border-bottom-color:#33281a}
  html.night .md tbody tr:nth-child(even){background:#1b140d}
  html.night .md table{box-shadow:0 0 0 1px var(--line)}
  html.night .md code,html.night .md pre{background:#2a2013;color:#e3d3b0}
  html.night .md hr{border-top-color:var(--line)}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button id="menubtn" aria-label="Menu préparation"></button>
  <b><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c8963c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px"><path d="M12 21C6.5 16 4.5 10.5 6 7M12 21c5.5-5 7.5-10.5 6-14M6 7a2.6 2.6 0 0 1 3.5-1.6A2.6 2.6 0 0 1 12 6.2a2.6 2.6 0 0 1 2.5-.8A2.6 2.6 0 0 1 18 7"/><path d="M12 21 8.3 8.5M12 21l3.7-12.5M12 21 6.2 10M12 21 17.8 10"/></svg> Ultreïataku</b>
  <div class="pos" id="posreadout">GPS inactif</div>
  <button id="nightbtn" aria-label="Mode nuit"></button>
</div>
<button class="mapbtn" id="zin" aria-label="Zoom +"></button>
<button class="mapbtn" id="zout" aria-label="Zoom −"></button>
<button class="mapbtn" id="loc" aria-label="Suivre ma position"></button>
<button class="mapbtn" id="lyr" aria-label="Changer de fond de carte"></button>
<div id="sheet" class="collapsed">
  <div id="grip"><span class="bar"></span></div>
  <div id="head"><div id="selrow">
    <select id="daysel"><option value="">— Choisir l'étape du jour —</option></select>
    <button id="gpsbtn"></button>
  </div></div>
  <div id="body"></div>
</div>

<div id="menu" class="overlay hidden">
  <div class="ovhead"><b>Préparer mon Chemin</b><button id="menuclose" aria-label="Fermer"></button></div>
  <div id="menulist"></div>
</div>
<div id="guide" class="overlay hidden">
  <div class="ovhead"><button id="guideback" aria-label="Retour"></button><b id="guidetitle"></b></div>
  <div id="guidebody" class="md"></div>
</div>

function variantFile(id,name){const m=VG[id];if(!m)return null;for(const k in m){if(name.indexOf(k)>=0)return m[k];}return null;}
let variantLayers=[];
function clearVariants(){variantLayers.forEach(l=>{try{map.removeLayer(l);}catch(e){}});variantLayers=[];}
function drawVariants(st,id){clearVariants();if(typeof VAR==="undefined")return;(st.alt||[]).forEach((a,idx)=>{if((CHOICES[id]||{})[idx]==='go'){const f=variantFile(id,a.n);if(f&&VAR[f])variantLayers.push(L.polyline(VAR[f],{color:"#b8352f",weight:4,opacity:.95,dashArray:"6 6"}).addTo(map));}});}
let dayLayer=null;
function dayKey(i){const st=S[i];let n=0;for(let k=0;k<=i;k++)if(S[k].c===st.c)n++;return st.c+"-"+String(n).padStart(2,'0');}
function drawDay(i){if(dayLayer){map.removeLayer(dayLayer);dayLayer=null;}const key=dayKey(i);if(typeof DAY!=="undefined"&&DAY[key]&&DAY[key].length>1)dayLayer=L.polyline(DAY[key],{color:CCOL[S[i].c],weight:5,opacity:.95}).addTo(map);}

const markers=[];
S.forEach((st,i)=>{
  const hw=st.alt&&st.alt.some(a=>a.w);
  const col=st.rest?"#3b7fd0":(hw?"#b8352f":CCOL[st.c]);
  const m=L.circleMarker([st.to[0],st.to[1]],{radius:st.rest?7:5,color:"#fff",weight:2,fillColor:col,fillOpacity:1}).addTo(map);

  markers.push(m);

function nearest(pos){let b=-1,bd=1e9;for(let i=0;i<S.length;i++){const d=hav(pos,[S[i].to[0],S[i].to[1]]);if(d<bd){bd=d;b=i;}}return{i:b,km:bd};}
function hav(a,b){const R=6371,dLa=(b[0]-a[0])*Math.PI/180,dLo=(b[1]-a[1])*Math.PI/180,la1=a[0]*Math.PI/180,la2=b[0]*Math.PI/180;const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function onGPS(p){
  gps=[p.coords.latitude,p.coords.longitude];const acc=p.coords.accuracy||0;
  if(!gpsMarker){gpsMarker=L.circleMarker(gps,{radius:8,color:"#fff",weight:3,fillColor:"#2b6edc",fillOpacity:1}).addTo(map);gpsCircle=L.circle(gps,{radius:acc,color:"#2b6edc",weight:1,fillColor:"#2b6edc",fillOpacity:.12}).addTo(map);}
  else{gpsMarker.setLatLng(gps);gpsCircle.setLatLng(gps).setRadius(acc);}
  const n=nearest(gps);posreadout.innerHTML="proche de "+S[n.i].to[2]+" (~"+n.km.toFixed(1)+" km)";
  if(follow)map.setView(gps,Math.max(map.getZoom(),14));
}
let gpsWatch=null;
function gpsErr(e){
  posreadout.textContent=
    (e&&e.code===1)?"Refusé — autorise la localisation (cadenas → Autorisations)":
    (e&&e.code===2)?"Position indisponible — active la localisation du téléphone + « Précise »":
    (e&&e.code===3)?"Trop long — réessaie dehors, ciel dégagé":
    "GPS : "+((e&&e.message)||"erreur inconnue");
}
function startGPS(){
  if(!window.isSecureContext){posreadout.textContent="GPS bloqué : page non sécurisée (ouvre en https)";return;}
  if(!navigator.geolocation){posreadout.textContent="GPS indisponible sur ce navigateur";return;}
  posreadout.textContent="Recherche GPS…";
  function begin(){
    navigator.geolocation.getCurrentPosition(onGPS,gpsErr,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
    try{if(gpsWatch!=null)navigator.geolocation.clearWatch(gpsWatch);}catch(e){}
    gpsWatch=navigator.geolocation.watchPosition(onGPS,gpsErr,{enableHighAccuracy:true,maximumAge:10000,timeout:25000});
  }
  if(navigator.permissions&&navigator.permissions.query){
    navigator.permissions.query({name:"geolocation"}).then(function(p){
      if(p.state==="denied"){posreadout.textContent="Refusé — autorise la localisation (cadenas → Autorisations)";return;}
      begin();
    }).catch(begin);
  }else begin();
}
locBtn.onclick=()=>{follow=!follow;locBtn.classList.toggle("on",follow);if(follow){if(!gps)startGPS();else map.setView(gps,Math.max(map.getZoom(),14));}};

function altHtml(st,idx,a){
  const id=stageId(st),chosen=(CHOICES[id]||{})[idx];
  let h=`<div class="n">${ic(TICON[a.t],18)}<span>${a.w?ic("heart",15)+" ":""}${a.n}</span></div><div class="badge">${TBADGE[a.t]}</div>`;
  if(a.m)h+=`<div class="m">${a.m}</div>`;
  if(a.t!=="path")h+=`<div class="choice"><button class="go ${chosen==='go'?'sel':''}" data-i="${idx}" data-v="go">${ic("check",15)} J'y vais</button><button class="skip ${chosen==='skip'?'sel':''}" data-i="${idx}" data-v="skip">${ic("arrow",15)} Je reste sur le chemin</button></div>`;
  else h+=`<div class="onpath">${ic("pin",14)} Sur le chemin — tu passeras devant</div>`;
  const vf=variantFile(id,a.n);
  if(vf)h+=`<div class="m">${ic("route",13)} Trace « visite » : gpx/reel/jours/${vf}</div>`;
  return `<div class="alt ${a.w?'want':''}">${h}</div>`;
}
function selectDay(i,center){
  daysel.value=i;const st=S[i],id=stageId(st);highlight(i);daysel.style.color=(typeof COLC!=="undefined"&&COLC[st.c])||"";
  let rest="";
  if(st.rest==="demi")rest=`<div class="banner rest demi">${ic("clock",18)}<div><b>Demi-journée</b> — étape courte aujourd'hui : profite de l'après-midi.</div></div>`;
  else if(st.rest)rest=`<div class="banner rest">${ic("moon",18)}<div><b>Demain : jour de repos à ${st.to[2]}.</b> Ce soir tu peux veiller — pas de réveil aux aurores.</div></div>`;
  const note=st.note&&!st.rest?`<div class="banner note">${ic("info",18)}<div>${st.note}</div></div>`:"";
  const fromName=st.from?st.from[2]:(i===0?START[2]:S[i-1].to[2]);
  const findStage=sid=>S.findIndex(x=>stageId(x)===sid);
  const nextIdx=st.next?findStage(st.next):(i+1<S.length?i+1:-1);
  const prevIdx=st.prev?findStage(st.prev):(i-1>=0?i-1:-1);
  const depOf=j=>S[j].from?S[j].from[2]:(j===0?START[2]:S[j-1].to[2]);
  const nav=`<div class="daynav">${prevIdx>=0?`<button data-go="${prevIdx}">${ic("arrow",14,"flip")} départ ${depOf(prevIdx)}</button>`:'<span style="flex:1"></span>'}${nextIdx>=0?`<button class="next" data-go="${nextIdx}">départ ${depOf(nextIdx)} ${ic("arrow",14)}</button>`:'<span style="flex:1"></span>'}</div>`;
  const branches=(st.links&&st.links.length)?`<h3 class="sec">${ic("nav",15)} Les deux chemins vers Namur</h3><div class="daynav">`+st.links.map(l=>{const j=S.findIndex(x=>stageId(x)===l.go);return j>=0?`<button data-go="${j}">${ic("route",14)} ${l.t}</button>`:"";}).join("")+`</div>`:"";
  let alts="";
  const wanted=(st.alt||[]).map((a,idx)=>[a,idx]).filter(x=>x[0].w);
  if(wanted.length){
    const dvs=wanted.filter(x=>x[0].t!=="path");
    const path=wanted.filter(x=>x[0].t==="path");
    if(dvs.length)alts+=`<h3 class="sec">${ic("nav",15)} À choisir aujourd'hui — visiter ou continuer</h3>`+dvs.map(([a,idx])=>altHtml(st,idx,a)).join("");
    if(path.length)alts+=`<h3 class="sec">${ic("pin",15)} À voir sur le chemin</h3>`+path.map(([a,idx])=>altHtml(st,idx,a)).join("");
  }else alts=`<div class="empty">${ic("route",18)} Étape de marche — pas d'arrêt prévu. Profite du chemin.</div>`;
  body.innerHTML=`
    <div class="daytitle"><span class="flag ${st.c}">${CNAME[st.c]}</span><h2>Jour ${st.d} — départ ${fromName}</h2></div>
    <p class="sub">Arrivée en fin de journée : <b>${st.to[2]}</b> · ${st.km} km${st.rest&&st.rest!=="demi"?" · repos demain":""}</p>
    ${nav}
    ${rest}${note}
    ${st.join?`<div class="banner join">${ic("pin",18)}<div><b>Point de jonction</b> — ${st.join}</div></div>`:''}
    ${branches}
    ${st.bus?`<div class="banner busb">${ic("bus",18)}<div><b>En bus aujourd'hui</b> : ${st.bus}</div></div>`:''}
    ${FAUNE[st.c]?`<div class="banner faune">${ic("info",18)}<div><b>Faune</b> : ${FAUNE[st.c]}</div></div>`:''}
    <div class="infos">
      <div class="inforow">${ic("bed",19)}<div><span class="lbl">Où dormir</span>${st.lg||"—"}</div></div>
      <div class="inforow">${ic("food",19)}<div><span class="lbl">Manger / ravitailler</span>${st.fd||"—"}</div></div>
    </div>${alts}
    <div class="gpxline">${ic("nav",14)} <b>Balisage à suivre</b> : ${BALISE[st.c]}</div>
    <div class="gpxline">${ic("route",14)} Trace GPS du jour : <code>gpx/reel/jours/</code> (+ variantes pour les jours à alternative). Vrais GPX officiels : <code>gpxdownloaded/</code>. Détails : <code>hebergement/</code> · <code>ravitaillement/</code>.</div>`;
  body.querySelectorAll(".choice button").forEach(b=>b.onclick=()=>{if(!CHOICES[id])CHOICES[id]={};const k=+b.dataset.i;CHOICES[id][k]=CHOICES[id][k]===b.dataset.v?undefined:b.dataset.v;saveChoices();selectDay(i,false);if(CHOICES[id][k]==='go'){const a=S[i].alt[k];if(a.goto){const j=S.findIndex(x=>stageId(x)===a.goto);if(j>=0){selectDay(j,true);return;}}const f=variantFile(id,a.n);if(f&&typeof VAR!=="undefined"&&VAR[f])map.fitBounds(L.latLngBounds(VAR[f]),{padding:[40,40]});}});
  body.querySelectorAll(".daynav button").forEach(b=>b.onclick=()=>selectDay(+b.dataset.go,true));
  drawDay(i);
  drawVariants(st,id);
  sheet.classList.remove("collapsed");
  if(center){if(dayLayer)map.fitBounds(dayLayer.getBounds(),{padding:[50,50]});else{const from=st.from||(i===0?START:S[i-1].to);map.setView([from[0],from[1]],13);}}
}

function openGuide(k){document.getElementById("guidetitle").textContent=GUIDES[k].t;var b=document.getElementById("guidebody");b.innerHTML=mdToHtml(GUIDES[k].md);b.scrollTop=0;guideEl.classList.remove("hidden");}
function mdEsc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mdInline(s){s=mdEsc(s);
 s=s.replace(/^\[\s*([xX]?)\s*\]\s*/,function(m,c){return '<span class="cbx'+(c?" on":"")+'"></span>';});
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,"$1");
 s=s.replace(/[✅✔]️?/g,'<span class="cbx on"></span>');
 return s;}
function mdToHtml(md){var L=md.split(/\r?\n/),h="",i=0,inL=false,lt="";
 function cl(){if(inL){h+="</"+lt+">";inL=false;}}
 while(i<L.length){var ln=L[i];
  if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<L.length&&/-/.test(L[i+1])&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[i+1])){cl();
   var hd=ln.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return mdInline(c.trim());});i+=2;var rw=[];
   while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i])){rw.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(function(c){return mdInline(c.trim());}));i++;}
   h+="<table><thead><tr>"+hd.map(function(x){return "<th>"+x+"</th>";}).join("")+"</tr></thead><tbody>"+rw.map(function(r){return "<tr>"+r.map(function(c){var ck=c.indexOf('class="cbx')>-1;return "<td"+(ck?' class="ck"':"")+">"+c+"</td>";}).join("")+"</tr>";}).join("")+"</tbody></table>";continue;}
  if(/^\s*$/.test(ln)){cl();i++;continue;}
  if(/^###\s+/.test(ln)){cl();h+="<h3>"+mdInline(ln.replace(/^###\s+/,""))+"</h3>";i++;continue;}
  if(/^##\s+/.test(ln)){cl();h+="<h2>"+mdInline(ln.replace(/^##\s+/,""))+"</h2>";i++;continue;}
  if(/^#\s+/.test(ln)){cl();h+="<h1>"+mdInline(ln.replace(/^#\s+/,""))+"</h1>";i++;continue;}
  if(/^\s*(---|\*\*\*)\s*$/.test(ln)){cl();h+="<hr>";i++;continue;}
  if(/^\s*>\s?/.test(ln)){cl();var q=[];while(i<L.length&&/^\s*>\s?/.test(L[i])){q.push(mdInline(L[i].replace(/^\s*>\s?/,"")));i++;}h+="<blockquote>"+q.join(" ")+"</blockquote>";continue;}
  if(/^\s*```/.test(ln)){cl();i++;var fb=[];while(i<L.length&&!/^\s*```/.test(L[i])){fb.push(L[i]);i++;}i++;
   var ne=fb.filter(function(x){return x.trim();});
   if(ne.length&&ne.every(function(x){return /^\s*\[\s*[xX]?\s*\]/.test(x);})){h+='<ul>';ne.forEach(function(x){h+='<li class="chk">'+mdInline(x.trim())+'</li>';});h+='</ul>';}
   else{var code="";fb.forEach(function(x){code+=mdEsc(x)+"\n";});h+="<pre><code>"+code+"</code></pre>";}continue;}
  if(/^\s*[-*]\s+/.test(ln)){var it=ln.replace(/^\s*[-*]\s+/,"");var ck=/^\[\s*[xX]?\s*\]/.test(it);if(!inL||lt!=="ul"){cl();h+="<ul>";inL=true;lt="ul";}h+="<li"+(ck?' class="chk"':"")+">"+mdInline(it)+"</li>";i++;continue;}
  if(/^\s*\d+\.\s+/.test(ln)){if(!inL||lt!=="ol"){cl();h+="<ol>";inL=true;lt="ol";}h+="<li>"+mdInline(ln.replace(/^\s*\d+\.\s+/,""))+"</li>";i++;continue;}
  cl();h+="<p>"+mdInline(ln)+"</p>";i++;}
 cl();return h;}
