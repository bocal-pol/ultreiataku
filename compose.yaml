# ============================================================
# Ultreiataku — Guide de pèlerinage (Laravel 13 + Filament 4 + React 19)
#
# Patterns PERF :
#   - code + vendor dans des volumes nommés (ext4 natif, ~370× plus rapide
#     que bind mount Windows). Sync Windows → volume via `docker compose watch`
#     (sections develop) ou manuellement : scripts/sync-vendor.sh
#   - node_modules protégé par un volume anonyme sur /app/node_modules
#
# Cluster PARTAGÉ : DB `ultreiataku` sur `sql-pgsql` (réseau sitev26-data),
# Redis sur `site-redis`. Pas de postgres/redis dédié.
#
# Prérequis DB (une seule fois) :
#   docker exec sitev26-site-pgsql-1 psql -U sail \
#     -c "CREATE DATABASE ultreiataku OWNER sail;"
#
# Démarrage dev :
#   docker compose -f Ultreiataku/compose.yaml up -d --build
#   docker compose -f Ultreiataku/compose.yaml watch
# ============================================================

name: ultreiataku

networks:
    # Réseau applicatif interne à Ultreiataku (backend ↔ frontend)
    app:
        driver: bridge
    # Réseaux externes partagés avec la stack SiteV26
    sitev26_data:
        external: true
        name: sitev26-data
    sitev26_app:
        external: true
        name: sitev26_app
    sitev26_sst:
        external: true
        name: sitev26-stat-shared

volumes:
    # PERF — code + vendor hors bind mount Windows
    ultreiataku-code:
    ultreiataku-vendor:

services:

    # ----------------------------------------------------------------
    # ultreiataku-app — backend Laravel 13 + Filament 4 (port 8096)
    # Réutilise l'image sail-8.4/app-fpm construite par auth-app
    # (même runtime PHP 8.4). Cluster PARTAGÉ site-pgsql.
    # ----------------------------------------------------------------
    ultreiataku-app:
        # Réutilise l'image FPM de la stack principale (sail-8.4/app-fpm).
        # Construite par auth-app dans InfraDocker/compose.yaml.
        image: 'sail-8.4/app-fpm'
        restart: unless-stopped
        user: "1000:1000"
        cap_drop: [ALL]
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8096:80'
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            # Vault désactivé en V1 — pas de module Vault requis
            VAULT_ENABLED: 'false'
        volumes:
            # PERF — code + vendor dans volumes nommés
            - 'ultreiataku-code:/var/www/html'
            - 'ultreiataku-vendor:/var/www/html/vendor'
            # Entrypoint partagé depuis InfraDocker
            - '../InfraDocker/docker/dev/fpm-entrypoint.sh:/usr/local/bin/sitev26-fpm-entrypoint:ro'
        develop:
            watch:
                - action: sync
                  path: ./backend
                  target: /var/www/html
                  ignore:
                      - vendor/
                      - node_modules/
                      - storage/
        entrypoint: ['/bin/bash', '/usr/local/bin/sitev26-fpm-entrypoint']
        networks:
            - app
            - sitev26_data
            - sitev26_sst
        depends_on: []

    # ----------------------------------------------------------------
    # ultreiataku-queue — worker de queue Redis (mails invitation Trip,
    # import GPX async, sync journal offline).
    # ----------------------------------------------------------------
    ultreiataku-queue:
        image: 'sail-8.4/app'
        restart: unless-stopped
        user: "1000:1000"
        cap_drop: [ALL]
        environment:
            WWWUSER: '1000'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: 'off'
            VAULT_ENABLED: 'false'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php /var/www/html/artisan queue:work redis --tries=3 --timeout=90 --sleep=3'
        volumes:
            - 'ultreiataku-code:/var/www/html'
            - 'ultreiataku-vendor:/var/www/html/vendor'
            - '../InfraDocker/docker/sail-entrypoint.sh:/usr/local/bin/sitev26-entrypoint:ro'
        entrypoint: ['/bin/bash', '/usr/local/bin/sitev26-entrypoint']
        networks:
            - app
            - sitev26_data
            - sitev26_sst
        depends_on:
            ultreiataku-app:
                condition: service_started

    # ----------------------------------------------------------------
    # ultreiataku-frontend — SPA React 19 / Vite (dev server, port 5181)
    # usePolling activé (cf. feedback_vite_polling_docker).
    # ----------------------------------------------------------------
    ultreiataku-frontend:
        build:
            context: './frontend'
            dockerfile: Dockerfile
        restart: unless-stopped
        user: "1000:1000"
        security_opt: [no-new-privileges:true]
        cap_drop: [ALL]
        ports:
            - '5181:5181'
        environment:
            API_TARGET: 'http://ultreiataku-app:80'
        volumes:
            - './frontend:/app'
            - '../shared:/shared:ro'
            - '../InfraDocker/docker/frontend-dev.sh:/frontend-dev.sh:ro'
            - '/app/node_modules'
        command: ['sh', '/frontend-dev.sh']
        networks:
            - app
            - sitev26_app
        depends_on:
            - ultreiataku-app
