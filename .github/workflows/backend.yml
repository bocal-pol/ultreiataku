name: CI — Ultreiataku Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Lint — Laravel Pint
  # ──────────────────────────────────────────────────────────────
  pint:
    name: Pint (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_pgsql, gd, zip, bcmath, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Lint (Pint --test)
        run: vendor/bin/pint --test

  # ──────────────────────────────────────────────────────────────
  # Static analysis — PHPStan niveau 6 + baseline
  # ──────────────────────────────────────────────────────────────
  phpstan:
    name: PHPStan (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_pgsql, gd, zip, bcmath, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: PHPStan analyse (level 6 + baseline)
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M --no-progress

  # ──────────────────────────────────────────────────────────────
  # Tests — PHPUnit / SQLite in-memory (phpunit.xml confirme DB_CONNECTION=sqlite)
  # ──────────────────────────────────────────────────────────────
  tests:
    name: PHPUnit (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_sqlite, pdo_pgsql, gd, zip, bcmath, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare environment
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          php artisan key:generate --ansi

      - name: PHPUnit (sqlite :memory:)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          VAULT_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          TELESCOPE_ENABLED: 'false'
          NIGHTWATCH_ENABLED: 'false'
        run: php artisan test --no-coverage
